name: Publish Android SGSR1 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish_android_sgsr1_release.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Run regression tests for Minecraft 26.2
        run: ./gradlew :common:test --rerun-tasks -Pminecraft_version_config=26.2

      - name: Build Minecraft 26.2 Fabric JAR
        run: ./gradlew assemble -Pminecraft_version_config=26.2

      - name: Prepare definitive Android SGSR1 JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR=$(find fabric/build/libs -maxdepth 1 -type f -name 'super_resolution-fabric-26.2-*.opengl.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          if [ -z "${JAR:-}" ]; then
            echo 'Expected Minecraft 26.2 OpenGL Fabric JAR was not produced.' >&2
            find fabric/build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi
          OUT='dist/super_resolution-android-sgsr1-mc26.2-r1.jar'
          cp "$JAR" "$OUT"
          sha256sum "$OUT" | tee dist/SHA256SUMS.txt
          echo "jar=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: super_resolution-android-sgsr1-mc26.2-r1
          path: |
            dist/super_resolution-android-sgsr1-mc26.2-r1.jar
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-sgsr1-mc26.2-r1
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/super_resolution-android-sgsr1-mc26.2-r1.jar \
              dist/SHA256SUMS.txt \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              dist/super_resolution-android-sgsr1-mc26.2-r1.jar \
              dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Android SGSR1 — Minecraft 26.2 (r1)' \
              --notes 'Validated Android/AARCH64 SGSR1 build for Minecraft 26.2. Java/OpenGL-only mode with Zink/Turnip support, Sodium/Iris/Complementary compatibility, dynamic 40/45/50/59/67/75/100% render scales, stable dynamic framebuffer handles, non-reloading Iris resize, and GPU timing metrics. Physically smoke-tested on Android with Adreno 740.'
          fi
