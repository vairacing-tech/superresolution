name: Android Build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    if: ${{ !contains(github.event.head_commit.message || '', 'SKIP') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Run Android SGSR1 regression tests
        run: ./gradlew :common:test --rerun-tasks -Pminecraft_version_config=26.2

      - name: Verify SGSR metrics lifecycle without a GPU
        run: python3 -B scripts/sgsr_metrics_contract.py

      - name: Build Android Fabric/OpenGL JAR
        run: ./gradlew assemble -Pminecraft_version_config=26.2

      - name: Prepare MobileGlues SGSR candidate and checksum
        shell: bash
        run: |
          mapfile -t candidate_jars < <(find fabric/build/libs -maxdepth 1 -type f -name 'super_resolution-fabric-26.2-*.opengl.jar' -print)
          if [[ ${#candidate_jars[@]} -ne 1 ]]; then
            printf 'Expected exactly one Fabric 26.2 OpenGL JAR, found %s\n' "${#candidate_jars[@]}" >&2
            printf '%s\n' "${candidate_jars[@]}" >&2
            exit 1
          fi
          candidate_dir=build/mobileglues-sgsr-candidate
          mkdir -p "$candidate_dir"
          candidate_name=super_resolution-android-sgsr1-mobileglues-mc26.2-candidate.jar
          cp "${candidate_jars[0]}" "$candidate_dir/$candidate_name"
          (cd "$candidate_dir" && sha256sum "$candidate_name" > SHA256SUMS.txt)

      - name: Upload MobileGlues SGSR candidate
        uses: actions/upload-artifact@v4
        with:
          name: super_resolution-android-sgsr1-mobileglues-mc26.2-candidate
          path: |
            build/mobileglues-sgsr-candidate/*
          if-no-files-found: error
