name: Android Build

on:
  push:
    branches: [ '*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    if: ${{ !contains(github.event.head_commit.message || '', 'SKIP') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Run Android SGSR1 regression tests
        run: ./gradlew :common:test --rerun-tasks -Pminecraft_version_config=26.2

      - name: Build Android Fabric/OpenGL JAR
        run: ./gradlew assemble -Pminecraft_version_config=26.2

      - name: Upload Android JAR
        uses: actions/upload-artifact@v4
        with:
          name: super_resolution-android-sgsr1-mc26.2
          path: |
            fabric/build/libs/super_resolution-fabric-26.2-*.opengl.jar
          if-no-files-found: error
